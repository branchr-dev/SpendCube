paths:
  data_dir: data
  input_dir: data/input
  output_dir: data/output
  db_path: data/db/spend_cube.db
  reference_dir: data/reference
  internal_category_hierarchy: data/reference/internal_category_hierarchy.csv
  keyword_rules: data/reference/keyword_rules.yaml

llm:
  model: claude-sonnet-4-20250514
  batch_size: 20
  dry_run: true
  max_cost_usd: 10.0
  api_key_env: ANTHROPIC_API_KEY

supplier_matching:
  fuzzy_auto_threshold: 88
  fuzzy_review_threshold: 70
  embedding_auto_threshold: 0.90
  embedding_review_threshold: 0.80
  corroboration_same_city: 5
  corroboration_same_postcode: 8
  corroboration_same_abn: 20

categorisation:
  confidence_high: 0.85
  confidence_medium: 0.60
  embedding_threshold: 0.80
  llm_fallback_threshold: 0.60

spend_cube:
  base_currency: AUD
  tail_spend_supplier_pct: 0.80
  tail_spend_value_pct: 0.20

recommendations:
  consolidation_threshold: 5
  consolidation_saving_pct: 0.08
  target_payment_days: 45
  wacc: 0.08
  min_wc_opportunity: 10000
  tail_spend_alert_pct: 0.05
  maverick_alert_pct: 0.15
  addressability_defaults:
    SUPPLIER_CONSOLIDATION: 0.70
    PAYMENT_TERM_EXTENSION: 0.80
    TAIL_SPEND_RATIONALISATION: 0.50
    CONTRACT_COMPLIANCE: 0.75
    COMPETITIVE_TENDER: 0.65
    CONTRACT_COVERAGE_GAP: 0.80
  competitive_tender_min_spend: 50000.0
  contract_coverage_gap_min_spend: 20000.0

logging:
  level: INFO
  json_format: false

column_mappings:
  DEFAULT:
    VENDOR_NAME: raw_supplier_name
    VENDOR_NUM: raw_supplier_id
    INV_NO: invoice_number
    INV_DATE: invoice_date
    LINE_DESC: raw_line_description
    AMT: original_amount
    CCY: original_currency
    GL_CODE: gl_account
    COST_CTR: cost_centre
    PAY_TERMS: raw_payment_terms
    PO_NUM: po_number
    BUS_UNIT: business_unit
    SITE: plant_site

client:
  name: ""                          # e.g. Acme Corporation
  engagement: "Procurement Spend Diagnostic"
  currency_label: "AUD"             # Display label for base currency in dashboard
