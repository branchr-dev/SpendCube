[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spendcube-backend"
version = "2.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "supabase>=2.3",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # Pipeline dependencies (src/ is mounted as volume; these must be present in the image)
    "sentence-transformers>=2.2",
    "rapidfuzz>=3.0",
    "anthropic>=0.25",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dateutil>=2.9",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
