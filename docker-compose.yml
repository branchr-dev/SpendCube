version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
      - ./config.yaml:/app/config.yaml:ro

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
